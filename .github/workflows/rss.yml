name: Generate Bellmare RSS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      # actions/setup-python を使わず、デフォルトのPython環境に直接インストールする
      - name: ライブラリのインストール
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests beautifulsoup4 feedgen

      - name: スクレイピングの実行
        run: python3 main.py

      - name: 生成したRSS（bellmare.xml）をコミットして保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bellmare.xml
          git commit -m "Update RSS feed" || exit 0
          git push
